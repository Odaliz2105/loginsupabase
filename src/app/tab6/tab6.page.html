<ion-header>
  <ion-toolbar color="danger">
    <ion-title>Pokémon API</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-input
      placeholder="Nombre Pokémon"
      [(ngModel)]="nombrePokemon">
    </ion-input>
  </ion-item>

  <ion-button expand="block" (click)="buscarPokemon()">
    Buscar
  </ion-button>

  <ion-card *ngIf="pokemon">

    <img [src]="pokemon.sprites.front_default">

    <ion-card-header>
      <ion-card-title>
        {{ pokemon.name | uppercase }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>

      <p><strong>ID:</strong> {{ pokemon.id }}</p>

      <p><strong>Altura:</strong> {{ pokemon.height }}</p>

      <p><strong>Peso:</strong> {{ pokemon.weight }}</p>

    </ion-card-content>

  </ion-card>

</ion-content>
