<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Galería
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">
        Galería
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-grid>

    <ion-row>

      <ion-col
        size="6"
        *ngFor="let photo of photoService.photos">

        <img [src]="photo.webviewPath" style="width: 100%;" />

      </ion-col>

    </ion-row>

  </ion-grid>

</ion-content>
